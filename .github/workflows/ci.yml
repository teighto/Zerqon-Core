name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Linux release toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Rust plugin build
        run: cargo build -p zerqon-hello-plugin --target wasm32-unknown-unknown --release --locked
      - name: Run compiled Rust plugin
        run: cargo run -p zerqon-plugins --example verify-plugin --locked -- target/wasm32-unknown-unknown/release/zerqon_hello_plugin.wasm
      - name: Java plugin API and host
        run: python scripts/build-java-plugins.py
      - name: Python tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Prepare official Minecraft data
        run: python scripts/prepare-data.py
      - name: Verify embedded block metadata
        run: python tools/block-data/generate.py --check
      - name: Prepare official inventory codec fixtures
        run: python scripts/test-inventory-codec.py --export .cache/inventory-oracle/official.json --export-default-items
      - name: Inventory oracle self-checks
        run: python tests/inventory_oracle/test_oracle.py
      - name: Original entity collision and step checks
        run: python scripts/test-entity-physics.py
      - name: Prepare pinned Java runtime fixtures
        shell: python
        run: |
          import hashlib
          import urllib.request
          from pathlib import Path
          assets = [
              ("adoptium-linux25.tar.gz", 61736206, "6fac98f0c8202efc3135a9e9e42aa61963ec42d1c5cbb40caf231e7b14a24ef6", "OpenJDK25U-jre_x64_linux_hotspot_25.0.5_8.tar.gz"),
              ("adoptium-windows25.zip", 58589419, "da78d54a2fcdbba1e92d5e3f07dd30236f96297891c4a21a781c3f38f5c0beae", "OpenJDK25U-jre_x64_windows_hotspot_25.0.5_8.zip"),
          ]
          for filename, size, expected, asset in assets:
              path = Path(".local") / filename
              if path.exists():
                  with path.open("rb") as source:
                      data = source.read(size + 1)
              else:
                  url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/" + asset
                  with urllib.request.urlopen(url, timeout=60) as response:
                      data = response.read(size + 1)
              if len(data) != size or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit("Official JRE fixture checksum mismatch: " + filename)
              if not path.exists():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with path.open("xb") as output:
                      output.write(data)
      - name: Verify managed runtime file inventories
        run: python scripts/java-runtime-integrity.py --windows-archive .local/adoptium-windows25.zip --linux-archive .local/adoptium-linux25.tar.gz --check
      - name: Generate isolated vanilla world fixture
        run: python scripts/generate-test-world.py --server-jar .cache/vanilla/26.3/server.jar --directory .local/vanilla-world-filled --accept-eula
      - name: Data and plugin integration tests
        run: cargo test --workspace --locked -- --ignored --skip measure_one_thousand_entities_on_flat_ground --skip measure_sixty_four_player_tracking_resource_cost --skip measure_small_packet_budget_cost --skip profiling::tests::real_cpu_capture_survives_cancelled_request_autosaves_stops_and_shuts_down
      - name: Native CPU sampler integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test -p zerqon --bin zerqon --no-run --locked --message-format=json > target/profiler-test-build.jsonl
          test_binary=$(python3 - <<'PY'
          import json
          from pathlib import Path
          paths = []
          for line in Path("target/profiler-test-build.jsonl").read_text().splitlines():
              entry = json.loads(line)
              if entry.get("reason") == "compiler-artifact" and entry.get("target", {}).get("name") == "zerqon" and entry.get("profile", {}).get("test") and entry.get("executable"):
                  paths.append(entry["executable"])
          if len(paths) != 1:
              raise SystemExit("Expected one native profiler test executable")
          print(paths[0])
          PY
          )
          sudo setcap cap_perfmon=ep "$test_binary"
          trap 'sudo setcap -r "$test_binary"' EXIT
          "$test_binary" --exact profiling::tests::real_cpu_capture_survives_cancelled_request_autosaves_stops_and_shuts_down --ignored --nocapture
      - name: Official packet codec checks
        run: python scripts/test-vanilla-codec.py
      - name: Official client packet codec checks
        run: python scripts/test-client-packet-codec.py
      - name: Check Rust inventory codec output with Minecraft
        run: python scripts/test-inventory-codec.py --fixtures .cache/inventory-rust-fixtures.json
      - name: Check live inventory packets with Minecraft
        run: python scripts/test-inventory-codec.py --fixtures .cache/native-inventory-fixtures.json
      - name: Build native Windows release
        if: runner.os == 'Windows'
        run: cargo build -p zerqon --release --locked
      - name: Build portable Linux release
        if: runner.os == 'Linux'
        run: cargo build -p zerqon --release --locked --target x86_64-unknown-linux-musl
      - name: Verify standalone Linux runtime
        if: runner.os == 'Linux'
        run: python scripts/package-release.py --check-linux-binary target/x86_64-unknown-linux-musl/release/zerqon
      - name: Linux release process and inventory checks
        if: runner.os == 'Linux'
        run: cargo test -p zerqon --release --locked --target x86_64-unknown-linux-musl --test server_smoke --test play_smoke --test inventory_native -- --include-ignored
      - name: Linux release first launch over HTTPS
        if: runner.os == 'Linux'
        run: cargo test -p zerqon --release --locked --target x86_64-unknown-linux-musl --test first_run accepted_fresh_launch_prepares_data_starts_and_stops_without_python -- --ignored --exact
      - name: Linux release storage recovery
        if: runner.os == 'Linux'
        run: cargo test -p zerqon-world --release --locked --target x86_64-unknown-linux-musl --test transaction_recovery
      - name: Linux release CPU sampler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test -p zerqon --bin zerqon --release --target x86_64-unknown-linux-musl --no-run --locked --message-format=json > target/musl-profiler-test-build.jsonl
          test_binary=$(python3 - <<'PY'
          import json
          from pathlib import Path
          paths = []
          for line in Path("target/musl-profiler-test-build.jsonl").read_text().splitlines():
              entry = json.loads(line)
              if entry.get("reason") == "compiler-artifact" and entry.get("target", {}).get("name") == "zerqon" and entry.get("profile", {}).get("test") and entry.get("executable"):
                  paths.append(entry["executable"])
          if len(paths) != 1:
              raise SystemExit("Expected one musl profiler test executable")
          print(paths[0])
          PY
          )
          sudo setcap cap_perfmon=ep "$test_binary"
          trap 'sudo setcap -r "$test_binary"' EXIT
          "$test_binary" --exact profiling::tests::real_cpu_capture_survives_cancelled_request_autosaves_stops_and_shuts_down --ignored --nocapture
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zerqonVswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $zerqonInstallation = & $zerqonVswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $zerqonInstallation) { throw 'MSVC installation was not found' }
          $zerqonVersion = Get-ChildItem -LiteralPath (Join-Path $zerqonInstallation 'VC\Tools\MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $zerqonDumpbin = Join-Path $zerqonVersion.FullName 'bin\Hostx64\x64\dumpbin.exe'
          $zerqonDependencies = & $zerqonDumpbin /DEPENDENTS target/release/zerqon.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect executable imports' }
          $zerqonDependencies
          if ($zerqonDependencies -match '(?i)\b(?:vcruntime|msvcp|msvcr)\d\S*\.dll\b') { throw 'Executable requires a separate Visual C++ runtime' }
      - name: Package allowlisted release files
        run: python scripts/package-release.py --skip-build
      - name: Upload development distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zerqon-${{ runner.os }}-x86_64
          path: |
            dist/releases/*.zip
            dist/releases/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
