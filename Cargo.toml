[workspace]
members = [".", "crates/zerqon-protocol", "crates/zerqon-world", "crates/zerqon-plugin-api", "crates/zerqon-plugins", "crates/zerqon-entities", "crates/zerqon-profiler", "crates/zerqon-inventory", "examples/hello-plugin"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
authors = ["teighto"]
license = "GPL-3.0-only"
repository = "https://github.com/teighto/Zerqon-Core"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
bytes = "1"
uuid = { version = "1", features = ["v3", "v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "zerqon"
description = "A Minecraft Java Edition 26.3 server core written in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zerqon-protocol = { path = "crates/zerqon-protocol" }
zerqon-world = { path = "crates/zerqon-world" }
zerqon-entities = { path = "crates/zerqon-entities" }
zerqon-profiler = { path = "crates/zerqon-profiler" }
zerqon-inventory = { path = "crates/zerqon-inventory" }
zerqon-plugins = { path = "crates/zerqon-plugins" }
zerqon-plugin-api = { path = "crates/zerqon-plugin-api" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-lc-rs = "1.19"
aes = { version = "0.9", features = ["zeroize"] }
cfb8 = { version = "0.9", features = ["zeroize"] }
zeroize = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
md-5 = "0.10"
tempfile = "3"
semver = "1"
zip = { version = "9.4", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
strip = "none"
